<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rugby Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a4d2e;
    --green-mid: #2d6a43;
    --green-light: #3a8a55;
    --gold: #d4a017;
    --gold-bright: #f5c842;
    --white: #f4f0e8;
    --grey: #8a8278;
    --dark: #0d1a10;
    --red: #c0392b;
    --blue: #1a3a6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* Grass texture background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 48px,
        rgba(255,255,255,0.02) 48px,
        rgba(255,255,255,0.02) 50px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 80px,
        rgba(255,255,255,0.015) 80px,
        rgba(255,255,255,0.015) 82px
      ),
      radial-gradient(ellipse at 50% 0%, rgba(42,120,60,0.25) 0%, transparent 60%),
      var(--dark);
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--green-mid);
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 2px;
    background: var(--gold);
  }

  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    color: var(--gold-bright);
    letter-spacing: 0.12em;
    text-shadow: 0 0 30px rgba(212,160,23,0.4), 2px 2px 0 rgba(0,0,0,0.5);
    line-height: 1;
  }

  .header .subtitle {
    font-size: 0.85rem;
    color: var(--grey);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Timer section */
  .timer-section {
    background: rgba(26,77,46,0.3);
    border: 1px solid rgba(212,160,23,0.2);
    border-radius: 8px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
  }

  .timer-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 10vw, 3.8rem);
    color: var(--white);
    letter-spacing: 0.05em;
    text-shadow: 0 0 20px rgba(245,200,66,0.3);
    min-width: 5ch;
    text-align: center;
    line-height: 1;
  }

  .timer-display.running {
    color: var(--gold-bright);
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  .timer-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .period-badge {
    background: var(--green-mid);
    color: var(--gold-bright);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.15em;
    padding: 4px 12px;
    border-radius: 3px;
    text-align: center;
    min-width: 100px;
  }

  .timer-buttons {
    display: flex;
    gap: 8px;
  }

  /* Buttons base */
  .btn {
    cursor: pointer;
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 0.08em;
    border-radius: 4px;
    transition: all 0.15s ease;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.15s;
  }

  .btn:hover::after { background: rgba(255,255,255,0.1); }
  .btn:active { transform: scale(0.96); }

  .btn-sm {
    padding: 7px 14px;
    font-size: 0.85rem;
  }

  .btn-gold {
    background: var(--gold);
    color: var(--dark);
    box-shadow: 0 2px 8px rgba(212,160,23,0.3);
  }

  .btn-ghost {
    background: rgba(255,255,255,0.07);
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .btn-danger {
    background: rgba(192,57,43,0.15);
    color: #e74c3c;
    border: 1px solid rgba(192,57,43,0.3);
  }

  /* Scoreboard */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    margin-bottom: 20px;
    align-items: start;
  }

  .team-card {
    background: rgba(26,77,46,0.2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: border-color 0.3s;
  }

  .team-card.scored {
    animation: scoreFlash 0.6s ease;
  }

  @keyframes scoreFlash {
    0% { background: rgba(212,160,23,0.05); }
    30% { background: rgba(212,160,23,0.25); border-color: var(--gold); }
    100% { background: rgba(26,77,46,0.2); }
  }

  .team-name-input {
    background: transparent;
    border: none;
    border-bottom: 2px solid rgba(255,255,255,0.15);
    color: var(--white);
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    letter-spacing: 0.1em;
    text-align: center;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    padding-bottom: 3px;
  }

  .team-name-input:focus { border-bottom-color: var(--gold); }
  .team-name-input::placeholder { color: rgba(255,255,255,0.25); }

  .score-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 14vw, 6rem);
    color: var(--white);
    line-height: 1;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: transform 0.2s;
  }

  .score-display.bump {
    animation: scoreBump 0.3s ease;
  }

  @keyframes scoreBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); color: var(--gold-bright); }
    100% { transform: scale(1); }
  }

  .score-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }

  .score-btn {
    width: 100%;
    padding: 8px 6px;
    font-size: 0.78rem;
    border-radius: 5px;
    cursor: pointer;
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s;
    position: relative;
  }

  .score-btn:active { transform: scale(0.96); }

  .score-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 5px;
    background: rgba(255,255,255,0);
    transition: 0.15s;
  }

  .score-btn:hover::after { background: rgba(255,255,255,0.1); }

  .btn-try { background: #1e7e34; color: #fff; box-shadow: 0 2px 6px rgba(30,126,52,0.3); }
  .btn-conversion { background: #0d6efd; color: #fff; box-shadow: 0 2px 6px rgba(13,110,253,0.2); }
  .btn-penalty { background: #d97706; color: #fff; box-shadow: 0 2px 6px rgba(217,119,6,0.2); }
  .btn-dropout { background: #6f42c1; color: #fff; box-shadow: 0 2px 6px rgba(111,66,193,0.2); }
  .btn-undo { background: rgba(255,255,255,0.07); color: var(--grey); border: 1px solid rgba(255,255,255,0.1); }

  /* VS separator */
  .vs-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 40px;
    gap: 8px;
  }

  .vs-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.1em;
  }

  .score-diff {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    color: var(--grey);
    letter-spacing: 0.05em;
    text-align: center;
    line-height: 1.3;
  }

  /* Points legend */
  .legend {
    background: rgba(26,77,46,0.15);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--grey);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Log */
  .log-section {
    background: rgba(13,26,16,0.6);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .log-header {
    background: rgba(26,77,46,0.4);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .log-header span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.15em;
    color: var(--gold-bright);
  }

  .log-list {
    max-height: 180px;
    overflow-y: auto;
    padding: 8px 0;
  }

  .log-list::-webkit-scrollbar { width: 4px; }
  .log-list::-webkit-scrollbar-track { background: transparent; }
  .log-list::-webkit-scrollbar-thumb { background: var(--green-mid); border-radius: 2px; }

  .log-empty {
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-size: 0.85rem;
    padding: 20px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .log-item {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .log-item:last-child { border-bottom: none; }

  .log-time {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    color: var(--grey);
    min-width: 36px;
    letter-spacing: 0.05em;
  }

  .log-badge {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 3px;
    min-width: 80px;
    text-align: center;
  }

  .log-team {
    color: rgba(255,255,255,0.7);
    font-size: 0.85rem;
    flex: 1;
    letter-spacing: 0.05em;
  }

  .log-pts {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    color: var(--gold-bright);
    min-width: 30px;
    text-align: right;
  }

  /* Reset button */
  .footer {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding-top: 4px;
  }

  .btn-reset {
    padding: 10px 28px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Rugby Scoreboard</h1>
    <div class="subtitle">Marcador de partido</div>
  </div>

  <!-- Timer -->
  <div class="timer-section">
    <div id="timerDisplay" class="timer-display">00:00</div>
    <div class="timer-controls">
      <div id="periodBadge" class="period-badge">1° Tiempo</div>
      <div class="timer-buttons">
        <button class="btn btn-sm btn-gold" id="btnStartStop" onclick="toggleTimer()">▶ Iniciar</button>
        <button class="btn btn-sm btn-ghost" onclick="nextPeriod()">Período →</button>
        <button class="btn btn-sm btn-ghost" onclick="resetTimer()">↺</button>
      </div>
    </div>
  </div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <!-- Local -->
    <div class="team-card" id="cardA">
      <input class="team-name-input" id="nameA" type="text" placeholder="LOCAL" value="LOCAL" maxlength="12">
      <div class="score-display" id="scoreA">0</div>
      <div class="score-actions">
        <button class="score-btn btn-try" onclick="addScore('A', 5, 'Try')">Try +5</button>
        <button class="score-btn btn-conversion" onclick="addScore('A', 2, 'Conversión')">Conversión +2</button>
        <button class="score-btn btn-penalty" onclick="addScore('A', 3, 'Penal')">Penal +3</button>
        <button class="score-btn btn-dropout" onclick="addScore('A', 3, 'Drop')">Drop +3</button>
        <button class="score-btn btn-undo" onclick="undoScore('A')">↩ Deshacer</button>
      </div>
    </div>

    <!-- VS -->
    <div class="vs-column">
      <div class="vs-text">VS</div>
      <div class="score-diff" id="diffDisplay">—</div>
    </div>

    <!-- Visitante -->
    <div class="team-card" id="cardB">
      <input class="team-name-input" id="nameB" type="text" placeholder="VISITA" value="VISITA" maxlength="12">
      <div class="score-display" id="scoreB">0</div>
      <div class="score-actions">
        <button class="score-btn btn-try" onclick="addScore('B', 5, 'Try')">Try +5</button>
        <button class="score-btn btn-conversion" onclick="addScore('B', 2, 'Conversión')">Conversión +2</button>
        <button class="score-btn btn-penalty" onclick="addScore('B', 3, 'Penal')">Penal +3</button>
        <button class="score-btn btn-dropout" onclick="addScore('B', 3, 'Drop')">Drop +3</button>
        <button class="score-btn btn-undo" onclick="undoScore('B')">↩ Deshacer</button>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#1e7e34"></div>Try = 5 pts</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0d6efd"></div>Conversión = 2 pts</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>Penal = 3 pts</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6f42c1"></div>Drop = 3 pts</div>
  </div>

  <!-- Log -->
  <div class="log-section">
    <div class="log-header">
      <span>📋 Historial de Puntos</span>
    </div>
    <div class="log-list" id="logList">
      <div class="log-empty">Sin anotaciones aún</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn btn-danger btn-reset" onclick="confirmReset()">🗑 Reiniciar Partido</button>
  </div>

</div>

<script>
  // State
  let scores = { A: 0, B: 0 };
  let history = { A: [], B: [] };
  let log = [];
  let timerSeconds = 0;
  let timerRunning = false;
  let timerInterval = null;
  let currentPeriod = 1;
  const periods = ['1° Tiempo', '2° Tiempo', 'Tiempo Extra', 'Muerte Súbita'];

  // Badge colors for log
  const badgeColors = {
    'Try':       { bg: '#1e7e34', color: '#fff' },
    'Conversión':{ bg: '#0d6efd', color: '#fff' },
    'Penal':     { bg: '#d97706', color: '#fff' },
    'Drop':      { bg: '#6f42c1', color: '#fff' },
  };

  function addScore(team, pts, type) {
    scores[team] += pts;
    history[team].push(pts);

    const teamName = document.getElementById(`name${team}`).value || team;
    const timeStr = formatTime(timerSeconds);

    log.unshift({ team, teamName, pts, type, time: timeStr });

    updateScoreDisplay(team);
    updateDiff();
    updateLog();

    // Flash animation
    const card = document.getElementById(`card${team}`);
    card.classList.remove('scored');
    void card.offsetWidth;
    card.classList.add('scored');

    const scoreEl = document.getElementById(`score${team}`);
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }

  function undoScore(team) {
    if (history[team].length === 0) return;
    const last = history[team].pop();
    scores[team] = Math.max(0, scores[team] - last);

    // Remove last log entry for this team
    const idx = log.findIndex(e => e.team === team);
    if (idx !== -1) log.splice(idx, 1);

    updateScoreDisplay(team);
    updateDiff();
    updateLog();
  }

  function updateScoreDisplay(team) {
    document.getElementById(`score${team}`).textContent = scores[team];
  }

  function updateDiff() {
    const diff = Math.abs(scores.A - scores.B);
    const el = document.getElementById('diffDisplay');
    if (scores.A === scores.B) {
      el.innerHTML = 'EMPATE';
    } else {
      const ahead = scores.A > scores.B ? (document.getElementById('nameA').value || 'LOCAL') : (document.getElementById('nameB').value || 'VISITA');
      el.innerHTML = `+${diff}<br><span style="font-size:0.75rem;letter-spacing:0.05em">${ahead.substring(0,8)}</span>`;
    }
  }

  function updateLog() {
    const el = document.getElementById('logList');
    if (log.length === 0) {
      el.innerHTML = '<div class="log-empty">Sin anotaciones aún</div>';
      return;
    }
    el.innerHTML = log.map(entry => {
      const bc = badgeColors[entry.type] || { bg: '#555', color: '#fff' };
      return `<div class="log-item">
        <div class="log-time">${entry.time}'</div>
        <div class="log-badge" style="background:${bc.bg};color:${bc.color}">${entry.type}</div>
        <div class="log-team">${entry.teamName}</div>
        <div class="log-pts">+${entry.pts}</div>
      </div>`;
    }).join('');
  }

  // Timer
  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const ss = (s % 60).toString().padStart(2, '0');
    return `${m}:${ss}`;
  }

  function toggleTimer() {
    if (timerRunning) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('btnStartStop').textContent = '▶ Continuar';
      document.getElementById('timerDisplay').classList.remove('running');
    } else {
      timerRunning = true;
      document.getElementById('btnStartStop').textContent = '⏸ Pausar';
      document.getElementById('timerDisplay').classList.add('running');
      timerInterval = setInterval(() => {
        timerSeconds++;
        document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = 0;
    document.getElementById('timerDisplay').textContent = '00:00';
    document.getElementById('timerDisplay').classList.remove('running');
    document.getElementById('btnStartStop').textContent = '▶ Iniciar';
  }

  function nextPeriod() {
    if (currentPeriod < periods.length) currentPeriod++;
    document.getElementById('periodBadge').textContent = periods[currentPeriod - 1];
    resetTimer();
  }

  function confirmReset() {
    if (confirm('¿Reiniciar el partido? Se perderán todos los puntos y el historial.')) {
      scores = { A: 0, B: 0 };
      history = { A: [], B: [] };
      log = [];
      currentPeriod = 1;
      document.getElementById('scoreA').textContent = '0';
      document.getElementById('scoreB').textContent = '0';
      document.getElementById('periodBadge').textContent = periods[0];
      document.getElementById('diffDisplay').textContent = '—';
      resetTimer();
      updateLog();
    }
  }

  // Initial diff
  updateDiff();
</script>
</body>
</html>
